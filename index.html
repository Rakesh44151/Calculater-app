<!DOCTYPE html>
<html lang="or">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Rakesh Calculator App</title>
    <style>
        body {
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            background-color: #f0f2f5;
            font-family: Arial, sans-serif;
            margin: 0;
        }
        .calculator {
            background-color: #333;
            padding: 20px;
            border-radius: 20px;
            box-shadow: 0px 4px 10px rgba(0,0,0,0.3);
            width: 300px;
        }
        .display {
            width: 100%;
            height: 60px;
            background-color: #fff;
            font-size: 32px;
            text-align: right;
            border: none;
            border-radius: 10px;
            margin-bottom: 20px;
            padding: 5px 10px;
            box-sizing: border-box;
        }
        .buttons {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 10px;
        }
        button {
            height: 60px;
            font-size: 22px;
            border: none;
            border-radius: 10px;
            cursor: pointer;
            background-color: #e0e0e0;
        }
        button:active {
            transform: scale(0.95);
        }
        .operator {
            background-color: orange;
            color: white;
        }
        .clear {
            background-color: red;
            color: white;
        }
        .equal {
            background-color: green;
            color: white;
        }
        .footer {
            text-align: center;
            color: white;
            margin-top: 15px;
            font-size: 14px;
        }
    </style>
</head>
<body>

<div class="calculator">
    <!-- Calculator Screen -->
    <input type="text" class="display" id="screen" readonly value="0">
    
    <!-- Calculator Buttons -->
    <div class="buttons">
        <button class="clear" onclick="clearScreen()">C</button>
        <button class="operator" onclick="press('/')">/</button>
        <button class="operator" onclick="press('*')">*</button>
        <button class="operator" onclick="press('-')">-</button>
        
        <button onclick="press('7')">7</button>
        <button onclick="press('8')">8</button>
        <button onclick="press('9')">9</button>
        <button class="operator" onclick="press('+')">+</button>
        
        <button onclick="press('4')">4</button>
        <button onclick="press('5')">5</button>
        <button onclick="press('6')">6</button>
        <button class="equal" style="grid-row: span 2; height: 130px;" onclick="calculate()">=</button>
        
        <button onclick="press('1')">1</button>
        <button onclick="press('2')">2</button>
        <button onclick="press('3')">3</button>
        
        <button onclick="press('0')" style="grid-column: span 2;">0</button>
        <button onclick="press('.')">.</button>
    </div>
    
    <!-- Your Proof of Creation -->
    <div class="footer">Designed by Rakesh</div>
</div>

<script>
    let screen = document.getElementById('screen');
    let isNewCalculation = true;

    function press(val) {
        if (isNewCalculation || screen.value === '0') {
            screen.value = val;
            isNewCalculation = false;
        } else {
            screen.value += val;
        }
    }

    function clearScreen() {
        screen.value = '0';
        isNewCalculation = true;
    }

    function calculate() {
        try {
            screen.value = eval(screen.value);
            isNewCalculation = true;
        } catch (e) {
            screen.value = 'Error';
            isNewCalculation = true;
        }
    }
</script>

</body>
</html>
