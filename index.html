<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>My Calculator</title>

  <style>
    * {
      box-sizing: border-box;
      font-family: Arial, sans-serif;
    }

    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      background: #f0f0f0;
    }

    .calculator {
      width: 320px;
      padding: 20px;
      background: white;
      border-radius: 20px;
      box-shadow: 0 10px 30px rgba(0,0,0,0.2);
    }

    #display {
      width: 100%;
      height: 70px;
      margin-bottom: 15px;
      border: none;
      border-radius: 10px;
      padding: 10px;
      font-size: 28px;
      text-align: right;
      background: #eeeeee;
    }

    .buttons {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 10px;
    }

    button {
      height: 60px;
      border: none;
      border-radius: 10px;
      font-size: 20px;
      cursor: pointer;
    }

    button:active {
      transform: scale(0.95);
    }

    .operator {
      background: orange;
      color: white;
    }

    .clear {
      background: red;
      color: white;
    }

    .equal {
      background: green;
      color: white;
    }
  </style>
</body>
</html>
